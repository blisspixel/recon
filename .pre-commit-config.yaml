repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false
        # Match scripts/check.py and CI: pyproject.toml owns the complete scope,
        # including the explicitly covered validation modules.

      # Attribution trailers never appear in a diff, so the added-line gate
      # cannot see them. They must be refused before the commit exists:
      # once a commit is pushed to a pull request branch, GitHub retains its
      # head under refs/pull/*/head permanently, and no history rewrite,
      # branch deletion, or release deletion can remove it.
      # Requires: pre-commit install --hook-type commit-msg
      - id: commit-msg-hygiene
        name: commit message hygiene (no attribution trailers)
        entry: python scripts/check_text_hygiene.py --message-file
        language: system
        stages: [commit-msg]
        always_run: true

      - id: metadata-coverage
        name: metadata-coverage (descriptions on every fingerprint detection)
        entry: python scripts/check_metadata_coverage.py
        language: system
        pass_filenames: false
        files: ^src/recon_tool/data/fingerprints/.*\.yaml$

  # Static lint for GitHub Actions workflow YAML. Catches:
  #   - unresolved action refs (the ``setup-uv@v8`` non-tag that broke
  #     the first v1.0.2 release),
  #   - shell-syntax errors in ``run:`` blocks,
  #   - expression-syntax errors (``${{ ... }}``),
  #   - deprecated ``::set-output::`` and friends.
  # Runs against every ``.yml`` / ``.yaml`` file under ``.github/workflows/``.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
