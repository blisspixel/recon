# Email platform and deliverability fingerprints. Cloud email providers, gateways, DMARC / DKIM / SPF ecosystem tooling.
#
# Loaded by recon_tool.fingerprints.load_fingerprints.
# Custom overrides: ~/.recon/fingerprints.yaml (additive only).

fingerprints:
- name: Microsoft 365
  slug: microsoft365
  category: Email & Communication
  confidence: high
  m365: true
  provider_group: microsoft365
  display_group: Microsoft 365
  product_family: Microsoft 365
  parent_vendor: Microsoft
  detections:
  - type: txt
    pattern: ^MS=ms
    reference: https://learn.microsoft.com/en-us/microsoft-365/admin/get-help-with-domains/create-dns-records-at-any-dns-hosting-provider
    verified: 2026-08-20
    description: >-
      Microsoft 365 domain-verification TXT (the current documented
      `MS=ms########` form Microsoft issues during tenant domain claim).
      Indicates the domain is administratively bound to a
      Microsoft 365 or Entra tenant. Does not prove the tenant
      is actively used for email. Some orgs verify the domain to
      claim the namespace then route mail elsewhere, so
      corroborate with MX evidence before reading this as "they
      run M365 email."
  - type: mx
    pattern: mail.protection.outlook.com
    reference: https://learn.microsoft.com/en-us/microsoft-365/enterprise/external-domain-name-system-records
    verified: 2026-08-19
    description: >-
      MX terminating at Microsoft 365's documented Exchange Online
      mail-protection cluster (`*.mail.protection.outlook.com`).
      Microsoft's current Learn DNS-records page still names this
      host. Newer accepted domains may instead use `*.mx.microsoft`.
      This observes inbound SMTP routing through Exchange Online
      Protection. An upstream gateway may sit in front even when
      this MX is published.
  - type: spf
    pattern: spf.protection.outlook.com
    reference: https://learn.microsoft.com/en-us/microsoft-365/enterprise/external-domain-name-system-records
    verified: '2026-08-20'
    description: >-
      SPF `include:spf.protection.outlook.com` authorizes
      Microsoft 365 to send mail on behalf of the domain.
      Typically present alongside the M365 MX and consistent
      with M365 use. Does not prove M365 is the primary sender;
      many domains include M365 as one of several authorized
      senders.
- name: Azure Communication Services Email
  slug: azure-communication-services-email
  category: Email & Communication
  confidence: high
  display_group: Email & Communication
  product_family: Azure Communication Services Email
  parent_vendor: Microsoft
  detections:
  - type: txt
    pattern: ^ms-domain-verification=
    reference: https://learn.microsoft.com/en-us/azure/communication-services/concepts/email/email-domain-configuration-troubleshooting
    verified: 2026-08-20
    description: >-
      Azure Communication Services Email custom-domain ownership token
      (`ms-domain-verification=<GUID>`). Microsoft documents this exact TXT
      form for an Email Communication Service resource. It observes an
      administrative domain binding to that email service, not Microsoft 365
      tenant verification, message activity, or delivery volume.
- name: Google Workspace
  slug: google-workspace
  category: Email & Communication
  confidence: high
  provider_group: google-workspace
  display_group: Google Workspace
  product_family: Google Workspace
  parent_vendor: Google
  detections:
  - type: mx
    pattern: aspmx.l.google.com
    reference: https://knowledge.workspace.google.com/admin/domains/set-up-mx-records-for-google-workspace
    verified: 2026-08-19
    description: >-
      MX terminating at Google Workspace's documented pre-2023
      inbound hosts (`aspmx.l.google.com` and the `alt1` through
      `alt4` variants). Google's current MX setup page names
      `smtp.google.com` as the default and still supports this
      series. This observes inbound mail routing through Google
      Workspace. An upstream gateway may sit in front even when
      this MX is published.
  - type: spf
    pattern: _spf.google.com
    reference: https://support.google.com/a/answer/33786
    verified: '2026-08-20'
    description: >-
      SPF `include:_spf.google.com` authorizes Google to send
      mail on behalf of the domain. Usually present with the GWS
      MX and consistent with Google Workspace use. Does not
      distinguish Workspace from consumer Gmail forwarding setups
      on its own; combined with the MX, the read is GWS.
- name: Cloudflare Email Service
  slug: cloudflare-email-routing
  category: Email & Communication
  confidence: high
  display_group: Email & Communication
  product_family: Cloudflare Email Service
  parent_vendor: Cloudflare
  detections:
  - type: mx
    pattern: mx.cloudflare.net
    reference: https://developers.cloudflare.com/email-service/configuration/domains/
    verified: 2026-08-13
    description: >-
      Apex MX terminating at Cloudflare Email Service's documented
      `*.mx.cloudflare.net` routing hosts. This shows that inbound mail for
      the queried namespace routes through Cloudflare Email Routing. It does
      not establish outbound sending or use of Cloudflare's CDN or security
      products.
  - type: spf
    pattern: _spf.mx.cloudflare.net
    reference: https://developers.cloudflare.com/email-service/configuration/domains/
    verified: 2026-08-13
    description: >-
      Apex SPF include or redirect to Cloudflare Email Service's documented
      `_spf.mx.cloudflare.net` policy. This authorizes Cloudflare to send or
      forward mail for the queried namespace. It does not by itself establish
      inbound routing or distinguish Email Sending from Email Routing.
