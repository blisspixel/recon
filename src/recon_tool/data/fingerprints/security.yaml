- name: Okta
  slug: okta
  category: Security & Compliance
  confidence: high
  display_group: Security & Compliance
  parent_vendor: Okta
  detections:
  - type: txt
    pattern: ^okta-domain-verification
    reference: https://developer.okta.com/docs/guides/custom-url-domain/main/
    description: >-
      Alternative Okta verification TXT prefix
      (`okta-domain-verification`). Okta's current custom-domain
      guide names `_oktaverification` and does not name this form,
      so it stays undated. Retained as a still-observed prefix
      with the same administrative-binding reading.
  - type: cname
    pattern: okta.com
    reference: https://developer.okta.com/docs/guides/custom-url-domain/main/
    verified: 2026-08-19
    description: >-
      CNAME pointing into okta.com. Okta's current custom-domain
      guide names this as the default custom-domain target
      (`example.okta.com`). DNSSEC orgs may instead use
      `okta-dnssec.com`. This observes a branded host delegated
      to Okta, not that Okta is the only IdP.
  - type: cname
    pattern: oktapreview.com
    reference: https://developer.okta.com/docs/guides/custom-url-domain/main/
    verified: 2026-08-19
    description: >-
      CNAME pointing into oktapreview.com. Okta's current
      custom-domain guide uses `customdomains.oktapreview.com` as
      the configured-domain example for preview orgs. This
      observes a preview or staging Okta host, not a production
      Workforce tenant.
