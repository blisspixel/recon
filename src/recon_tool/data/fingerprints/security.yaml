# Security and identity fingerprints. EDR, SIEM, IdP, zero-trust access, credential-hygiene tooling.
#
# Loaded by recon_tool.fingerprints.load_fingerprints.
# Custom overrides: ~/.recon/fingerprints.yaml (additive only).

fingerprints:
- name: CrowdStrike Falcon
  slug: crowdstrike
  category: Security & Compliance
  confidence: high
  match_mode: all
  detections:
  - type: txt
    pattern: ^crowdstrike-falcon-site-verification=
    reference: https://www.crowdstrike.com/platform/
    description: >-
      CrowdStrike Falcon domain-verification TXT (CrowdStrike is
      a cloud-delivered endpoint-protection vendor). Indicates
      the domain is registered with a Falcon tenant. Does not
      prove sensor coverage on endpoints; sensor rollout is
      independent of the domain verification.
  - type: txt
    pattern: crowdstrike
    reference: https://www.crowdstrike.com/platform/
    description: >-
      Catch-all TXT pattern containing the literal string
      "crowdstrike". This is corroborating evidence for the
      higher-specificity Falcon verification prefix, not a
      standalone detection path. Requiring both patterns suppresses
      unrelated TXT records that merely mention CrowdStrike in
      procurement notes, asset tags, or similar contexts.
- name: KnowBe4
  slug: knowbe4
  category: Security & Compliance
  confidence: high
  detections:
  - type: txt
    pattern: ^knowbe4-site-verification=
    reference: https://www.knowbe4.com/products/security-awareness-training
    description: >-
      KnowBe4 domain-verification TXT (KnowBe4 is a security-
      awareness and phishing-simulation training vendor).
      Indicates the domain is registered with a KnowBe4 account,
      typically so that simulated-phishing campaigns can send
      from a tenant-owned domain. Does not by itself prove
      active training rollout.
  - type: spf
    pattern: _spf.psm.knowbe4.com
    reference: https://www.knowbe4.com/products/phisher
    description: >-
      SPF `include:_spf.psm.knowbe4.com` authorizes KnowBe4's
      PhishER / PhishER Plus mail-handling infrastructure to
      send mail on behalf of the domain. Typically present
      alongside the KnowBe4 verification TXT; useful as a second
      corroborating signal.
- name: Proofpoint
  slug: proofpoint
  category: Security & Compliance
  confidence: high
  detections:
  - type: txt
    pattern: ^proofpoint-domain-verification=
    reference: https://help.proofpoint.com/
    description: >-
      Proofpoint domain-verification TXT (Proofpoint is an email
      security gateway and CASB vendor). Indicates the domain is
      administratively bound to a Proofpoint tenant. Does not
      prove the gateway sits in front of inbound mail; check MX
      evidence for that.
  - type: txt
    pattern: ^proofpoint-
    reference: https://help.proofpoint.com/
    description: >-
      Less-specific Proofpoint TXT prefix, used by some
      Proofpoint product lines (Email Fraud Defense, Digital
      Risk Protection) for domain claim. Lower specificity than
      the `proofpoint-domain-verification=` form; the
      higher-specificity pattern is preferred when both fire.
  - type: mx
    pattern: pphosted.com
    reference: https://www.proofpoint.com/us/products/email-protection
    description: >-
      MX terminating at Proofpoint's mail-protection cluster
      (`*.pphosted.com`, "PP hosted"). Indicates Proofpoint
      sits in front of inbound mail for the domain. Often
      observed in front of Microsoft 365 or Google Workspace
      tenants; the downstream provider is not deducible from
      this MX alone.
  - type: spf
    pattern: spf.pphosted.com
    reference: https://www.proofpoint.com/us/products/email-protection
    description: >-
      SPF `include:spf.pphosted.com` authorizes Proofpoint to
      send mail on behalf of the domain. Typically paired with
      the Proofpoint MX.
  - type: spf
    pattern: _spf.proofpoint.com
    reference: https://www.proofpoint.com/us/products/email-protection
    description: >-
      Alternative Proofpoint SPF include (`_spf.proofpoint.com`),
      used by some tenant configurations. Same authorization
      semantics as `spf.pphosted.com`.
- name: Mimecast
  slug: mimecast
  category: Security & Compliance
  confidence: high
  detections:
  - type: txt
    pattern: ^mimecast
    reference: https://mimecastsupport.zendesk.com/hc/en-us/articles/34000818734995-Directories-Managing-Internal-Domain-Subdomains
    description: >-
      Mimecast domain-verification TXT prefix (`mimecast`).
      Current Mimecast domain-validation articles tell the
      operator to publish a registrar-specific verification
      code at `@`, and do not name this prefix, so it stays
      undated. Retained as a still-observed administrative
      claim. It does not prove the gateway is in the inbound
      mail flow.
  - type: mx
    pattern: mimecast.com
    reference: https://mimecastsupport.zendesk.com/hc/en-us/articles/34000417366675-Account-Settings-Mimecast-Gateway-Configuration
    verified: 2026-08-20
    description: >-
      MX terminating at Mimecast (`*.mimecast.com` regional
      hosts such as `us-smtp-inbound-1.mimecast.com`). Mimecast's
      current gateway-configuration article names those inbound
      hostnames. This observes inbound mail routing through
      Mimecast. An upstream or downstream provider is not
      deducible from this MX alone.
  - type: spf
    pattern: _netblocks.mimecast.com
    reference: https://mimecastsupport.zendesk.com/hc/en-us/articles/34000792642963-Connect-Application-Implementing-SPF-for-Outbound-Email
    verified: 2026-08-20
    description: >-
      SPF `include:_netblocks.mimecast.com` (or a regional
      prefix such as `us._netblocks.mimecast.com`). Mimecast's
      current outbound-SPF article names the global include and
      the regional variants. This authorizes Mimecast to send
      mail for the queried namespace. It does not by itself
      establish inbound MX routing.
- name: Barracuda
  slug: barracuda
  category: Security & Compliance
  confidence: high
  detections:
  - type: mx
    pattern: barracudanetworks.com
    reference: https://documentation.campus.barracuda.com/wiki/spaces/EGD/pages/2850986
    verified: 2026-08-20
    description: >-
      MX terminating at Barracuda Email Gateway Defense
      (`*.ess.barracudanetworks.com`). Barracuda's current
      domain-status page tells operators to verify that MX
      records point to this suffix. This observes inbound mail
      routing through Barracuda. It does not identify a
      downstream mailbox provider.
