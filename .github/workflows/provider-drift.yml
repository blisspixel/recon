name: Provider drift

# Passive live smoke coverage for public DNS, certificate transparency, and
# identity discovery endpoint drift. This is separate from CI because it uses
# real network endpoints and is meant to catch upstream behavior changes, not
# block every pull request.
on:
  schedule:
    # Wednesday 08:23 UTC. Off the top of the hour to reduce scheduled-run
    # delay or drop risk during GitHub Actions high-load windows.
    - cron: "23 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pin the live smoke job explicitly to the newest stable interpreter.
      # This job measures upstream provider drift, not interpreter drift; the
      # supported floor is covered by the CI test matrix.
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync

      - name: Run passive live integration smoke
        run: uv run pytest tests/test_integration.py -m integration -q
