name: Secrets scan

# Three triggers covering the realistic leak surfaces:
#   - pull_request: catch a leak before it reaches main.
#   - push to main: catch a direct push that bypassed PR review.
#   - schedule (weekly): catch leaks already in history (a key rotated
#     today re-leaks if it remains in a historical commit) and catch
#     drift between gitleaks rule updates and our codebase.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Sunday 06:00 UTC is a low-traffic window; weekly cadence balances
    # signal value against runner cost.
    - cron: "0 6 * * 0"

permissions:
  # Read-only: secrets-scan must not be able to publish, comment, or
  # mint OIDC tokens. A compromised scanner that could write would be
  # worse than no scanner.
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history needed so the scheduled run inspects the
          # entire branch, not just the tip.
          fetch-depth: 0

      # The standalone scanner is MIT-licensed. The separate gitleaks-action
      # requires an organization license; do not disable this required scan.
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$install_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$install_dir/$archive" | sha256sum --check --strict
          tar -xzf "$install_dir/$archive" -C "$install_dir" gitleaks
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"

      - name: Scan full Git history
        id: scan
        run: |
          set -euo pipefail
          status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" \
            --redact=100 --exit-code=1 --no-banner \
            --report-format=sarif --report-path="$RUNNER_TEMP/gitleaks.sarif" || status=$?
          printf '### Gitleaks full-history scan\nExit status: %s (0 means no findings).\n' \
            "$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload redacted scan report
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: error
          retention-days: 7
